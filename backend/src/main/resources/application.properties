spring.application.name=yeogi-namgim
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:15432}/${DB_NAME:yeoginamgim}?currentSchema=app,public
spring.datasource.username=${DB_USERNAME:yeoginamgim}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=app

spring.flyway.default-schema=app
spring.flyway.schemas=app

push.enabled=${PUSH_ENABLED:false}
push.fcm.project-id=${FCM_PROJECT_ID:}
push.fcm.client-email=${FCM_CLIENT_EMAIL:}
push.fcm.private-key=${FCM_PRIVATE_KEY:}
push.apns.team-id=${APNS_TEAM_ID:}
push.apns.key-id=${APNS_KEY_ID:}
push.apns.bundle-id=${APNS_BUNDLE_ID:}
push.apns.private-key=${APNS_PRIVATE_KEY:}
push.apns.sandbox=${APNS_SANDBOX:false}

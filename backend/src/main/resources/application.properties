spring.application.name=yeogi-namgim
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:15432}/${DB_NAME:yeoginamgim}?currentSchema=app,public
spring.datasource.username=${DB_USERNAME:yeoginamgim}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=app

spring.flyway.default-schema=app
spring.flyway.schemas=app

push.enabled=${PUSH_ENABLED:false}
push.fcm.project-id=${FCM_PROJECT_ID:}
push.fcm.client-email=${FCM_CLIENT_EMAIL:}
push.fcm.private-key=${FCM_PRIVATE_KEY:}
push.apns.team-id=${APNS_TEAM_ID:}
push.apns.key-id=${APNS_KEY_ID:}
push.apns.bundle-id=${APNS_BUNDLE_ID:}
push.apns.private-key=${APNS_PRIVATE_KEY:}
push.apns.sandbox=${APNS_SANDBOX:false}

auth.enabled=${AUTH_ENABLED:false}
auth.jwt-secret=${AUTH_JWT_SECRET:}
auth.verification-secret=${AUTH_VERIFICATION_SECRET:}
auth.issuer=yeogi-namgim
auth.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:15m}
auth.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:14d}
friends.invitation-ttl=${FRIEND_INVITATION_TTL:24h}
auth.mail-from=${AUTH_MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=${MAIL_STARTTLS:true}
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
